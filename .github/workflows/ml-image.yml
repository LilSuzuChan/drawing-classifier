name: Build and publish ML training image

on:
  push:
    branches: ['**']
    paths:
      - ml/**
      - web/public/models/mnist_model.onnx
      - .github/workflows/ml-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lilsuzuchan/drawing-classifier-train

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check lock file and run tests in the test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ml
          file: ml/Dockerfile
          target: test-report
          build-contexts: web-models=web/public/models
          outputs: type=local,dest=${{ runner.temp }}/pytest-report
          cache-from: type=gha,scope=ml-image
          cache-to: type=gha,scope=ml-image,mode=max

      - name: Report test results
        env:
          REPORT_DIR: ${{ runner.temp }}/pytest-report
        run: |
          cat "$REPORT_DIR/output.txt"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          def escape(text, is_property=False):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if is_property else text

          report = os.environ["REPORT_DIR"]
          junit = os.path.join(report, "junit.xml")
          if not os.path.exists(junit):
              with open(os.path.join(report, "output.txt")) as output:
                  print(f"::error title=pytest::{escape(output.read()[-3000:])}")
          else:
              for case in ET.parse(junit).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      name = f"{case.get('classname')}.{case.get('name')}"
                      detail = (problem.get("message") or "") + "\n" + (problem.text or "")
                      print(f"::error title={escape('pytest ' + name, True)}::{escape(detail[-3000:])}")
          PY
          exit "$(cat "$REPORT_DIR/exit-code")"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push runtime image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ml
          file: ml/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml-image

      - name: Record image digest and size
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          platform_digest=$(jq -r 'if .manifests then [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest else empty end' <<<"$manifest")
          if [ -n "$platform_digest" ]; then
            manifest=$(docker buildx imagetools inspect --raw "$IMAGE@$platform_digest")
          fi
          compressed=$(jq '[.layers[].size] | add' <<<"$manifest")
          layers=$(jq '.layers | length' <<<"$manifest")
          mib=$(awk -v bytes="$compressed" 'BEGIN { printf "%.1f", bytes / 1048576 }')
          echo "::notice title=ML training image::$IMAGE@$DIGEST compressed=${compressed}B (${mib}MiB) layers=$layers"
          {
            echo "### ML training image"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| reference | \`$IMAGE@$DIGEST\` |"
            echo "| tags | $(tr '\n' ' ' <<<"$TAGS") |"
            echo "| compressed size (linux/amd64) | $compressed bytes ($mib MiB) |"
            echo "| layers | $layers |"
          } >> "$GITHUB_STEP_SUMMARY"
