server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    location /api/ {
        proxy_pass http://feedback-api:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /internal/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
