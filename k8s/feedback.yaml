apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drawing-feedback
  namespace: drawing-classifier
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-api
  namespace: drawing-classifier
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: feedback-api
  template:
    metadata:
      labels:
        app: feedback-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/lilsuzuchan/drawing-classifier-feedback:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FEEDBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: drawing-feedback
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drawing-feedback
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-api
  namespace: drawing-classifier
spec:
  selector:
    app: feedback-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feedback-api
  namespace: drawing-classifier
spec:
  podSelector:
    matchLabels:
      app: feedback-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: drawing-classifier
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeflow
      ports:
        - port: 8080
          protocol: TCP
